<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- nginx pone aquí el nonce de cada respuesta -->
    <meta name="csp-nonce" content="__CSP_NONCE__" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f14" />
    <!-- La compilación cambia este bloque por la cabecera de cada página -->
    <!--cabecera-->
    <title>Pilot SSH</title>
    <!--/cabecera-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Tema antes del primer pintado; en archivo por la CSP -->
    <script src="/tema.js"></script>
  </head>
  <body>
    <div id="root"><!--contenido--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
