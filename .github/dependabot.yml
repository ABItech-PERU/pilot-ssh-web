version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      acciones:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      menores:
        update-types: [minor, patch]
    # Una versión mayor se adopta a propósito, no al unir un PR suelto.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    # Solo parches: Node fijo en su LTS y nginx en su rama estable.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]
    commit-message:
      prefix: build
