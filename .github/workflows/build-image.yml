name: Construir imagen

on:
  workflow_call:
    outputs:
      arbol:
        description: Huella del árbol de git; nombra la imagen
        value: ${{ jobs.imagen.outputs.arbol }}

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/abitech-peru/pilotssh-web
  TRIVY: 0.76.1

jobs:
  imagen:
    name: Construir, probar y publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      arbol: ${{ steps.huella.outputs.arbol }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sobrevive al merge commit, a diferencia del SHA.
      - name: Calcular la huella
        id: huella
        run: echo "arbol=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Buscar si ya existe
        id: existe
        env:
          ARBOL: ${{ steps.huella.outputs.arbol }}
        run: |
          if docker buildx imagetools inspect "$IMAGEN:arbol-$ARBOL" > /dev/null 2>&1; then
            echo "si=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existe.outputs.si != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir
        if: steps.existe.outputs.si != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          tags: ${{ env.IMAGEN }}:prueba
          build-args: &argumentos |
            VERSION=${{ steps.huella.outputs.arbol }}
          labels: &etiquetas |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Arrancar exige la API; aquí basta la imagen.
      - name: Probar la imagen
        if: steps.existe.outputs.si != 'true'
        env:
          ARBOL: ${{ steps.huella.outputs.arbol }}
        run: |
          test "$(docker run --rm "$IMAGEN:prueba" cat /opt/pilotssh/dist/version.txt)" = "$ARBOL"
          docker run --rm "$IMAGEN:prueba" test -f /opt/pilotssh/dist/index.html
          docker run --rm --entrypoint nginx "$IMAGEN:prueba" -t

      # Bloquea si hay algo alto o crítico con arreglo.
      - name: Revisar vulnerabilidades (Trivy)
        if: steps.existe.outputs.si != 'true'
        run: |
          base=https://github.com/aquasecurity/trivy/releases/download/v$TRIVY
          curl -fsSLO "$base/trivy_${TRIVY}_Linux-64bit.tar.gz"
          curl -fsSL "$base/trivy_${TRIVY}_checksums.txt" | sha256sum -c --ignore-missing
          tar -xzf "trivy_${TRIVY}_Linux-64bit.tar.gz" trivy
          ./trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$IMAGEN:prueba"

      - name: Publicar
        if: steps.existe.outputs.si != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: |
            ${{ env.IMAGEN }}:arbol-${{ steps.huella.outputs.arbol }}
            ${{ env.IMAGEN }}:sha-${{ github.sha }}
          build-args: *argumentos
          labels: *etiquetas
          cache-from: type=gha
