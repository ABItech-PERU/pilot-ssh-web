# develop: pruebas. staging -> uat y main -> prd: pruebas y despliegue
# Guia: ../pilot-ssh-api/docs/github-actions.md
name: Web

on:
  push:
    branches: [develop, staging, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npx vitest run

  desplegar:
    needs: pruebas
    # Solo staging y main despliegan; develop se queda en local
    if: github.event_name != 'pull_request' && (github.ref_name == 'staging' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    # prd pide aprobacion
    environment: ${{ github.ref_name == 'main' && 'prd' || 'uat' }}
    steps:
      # Dokploy o SSH, segun lo configurado en el ambiente
      - name: Desplegar
        env:
          RAMA: ${{ github.ref_name }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DOKPLOY_API_KEY" ]; then
            curl -sS --fail-with-body -X POST "$DOKPLOY_URL/api/compose.deploy" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}"
          elif [ -n "$DEPLOY_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/despliegue
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/despliegue
            ssh -i ~/.ssh/despliegue -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$DEPLOY_PATH' && git pull --ff-only origin '$RAMA' && docker compose up -d --build"
          else
            echo "Sin Dokploy ni SSH en este ambiente: no se despliega."
          fi
