name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS: 8.30.1

jobs:
  security:
    name: Seguridad (secretos y dependencias)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Buscar secretos (Gitleaks)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS
          curl -fsSLO "$base/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          curl -fsSL "$base/gitleaks_${GITLEAKS}_checksums.txt" | sha256sum -c --ignore-missing
          tar -xzf "gitleaks_${GITLEAKS}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner

      - name: Auditar paquetes (npm audit)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Tipos y pruebas (TypeScript y Vitest)
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Instalar dependencias
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Revisar tipos
        run: npm run typecheck
      - name: Correr pruebas
        run: npm test
