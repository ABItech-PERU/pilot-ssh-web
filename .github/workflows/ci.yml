# develop: pruebas. staging -> uat y main -> prd: pruebas y despliegue
# Guia: ../pilot-ssh-api/docs/github-actions.md
name: Web

on:
  push:
    branches: [develop, staging, main]
  pull_request:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npx vitest run

  desplegar:
    needs: pruebas
    # develop no se despliega
    if: github.event_name == 'push' && github.ref_name != 'develop'
    runs-on: ubuntu-latest
    # Variables y secreto por ambiente; prd pide aprobacion
    environment: ${{ github.ref_name == 'main' && 'prd' || 'uat' }}
    steps:
      - name: Desplegar en Dokploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          if [ -z "$DOKPLOY_API_KEY" ]; then
            echo "Sin DOKPLOY_API_KEY en este ambiente: no se despliega."
            exit 0
          fi
          curl -fsS -X POST "$DOKPLOY_URL/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}"
