name: Desplegar

on:
  workflow_call:
    inputs:
      ambiente:
        description: uat o prod; prefija sus variables y secretos
        type: string
        required: true
      arbol:
        description: Huella de la imagen ya probada
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGEN: ghcr.io/abitech-peru/pilotssh-web

jobs:
  deploy:
    name: Desplegar a ${{ inputs.ambiente }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AMBIENTE: ${{ inputs.ambiente }}
      ARBOL: ${{ inputs.arbol }}
      WEB_URL: ${{ vars[format('{0}_WEB_URL', inputs.ambiente)] }}
      DOKPLOY_URL: ${{ vars[format('{0}_DOKPLOY_URL', inputs.ambiente)] }}
      DOKPLOY_COMPOSE_ID: ${{ vars[format('{0}_DOKPLOY_COMPOSE_ID', inputs.ambiente)] }}
      DOKPLOY_API_KEY: ${{ secrets[format('{0}_DOKPLOY_API_KEY', inputs.ambiente)] }}
      DEPLOY_HOST: ${{ vars[format('{0}_DEPLOY_HOST', inputs.ambiente)] }}
      DEPLOY_PORT: ${{ vars[format('{0}_DEPLOY_PORT', inputs.ambiente)] || '22' }}
      DEPLOY_USER: ${{ vars[format('{0}_DEPLOY_USER', inputs.ambiente)] }}
      DEPLOY_PATH: ${{ vars[format('{0}_DEPLOY_PATH', inputs.ambiente)] }}
      DEPLOY_KNOWN_HOSTS: ${{ vars[format('{0}_DEPLOY_KNOWN_HOSTS', inputs.ambiente)] }}
      DEPLOY_SSH_KEY: ${{ secrets[format('{0}_DEPLOY_SSH_KEY', inputs.ambiente)] }}
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dokploy despliega la etiqueta del ambiente.
      - name: Promover la imagen
        run: docker buildx imagetools create --tag "$IMAGEN:$AMBIENTE" "$IMAGEN:arbol-$ARBOL"

      - name: Avisar al servidor
        run: |
          if [ -n "$DOKPLOY_API_KEY" ]; then
            curl -fsS --fail-with-body -X POST "$DOKPLOY_URL/api/compose.deploy" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"composeId\": \"$DOKPLOY_COMPOSE_ID\"}"
          elif [ -n "$DEPLOY_SSH_KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/despliegue
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/despliegue
            ssh -i ~/.ssh/despliegue -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
              "cd '$DEPLOY_PATH' && git fetch --quiet origin && git checkout --quiet --detach '$GITHUB_SHA' && IMAGE_TAG='arbol-$ARBOL' sh deploy/docker/desplegar.sh"
          else
            echo "Falta configurar Dokploy o SSH para $AMBIENTE (docs/github-actions.md)." >&2
            exit 1
          fi

      # Con start-first, la versión vieja responde hasta el cambio.
      - name: Esperar la versión nueva
        run: |
          : "${WEB_URL:?Falta la variable ${AMBIENTE^^}_WEB_URL}"
          until test "$(curl -fsS "$WEB_URL/version.txt")" = "$ARBOL"; do
            sleep 5
          done
          curl -fsSI "$WEB_URL/" | grep -qi "^content-security-policy:"
          curl -fsSI "$WEB_URL/" | grep -qi "^strict-transport-security:"
