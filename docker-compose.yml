# Pilot SSH, web, en Docker Swarm: dos copias que se relevan sin corte
#   sh deploy/docker/desplegar.sh
# Guia: docs/deployment.md

services:
  app:
    image: ${IMAGE_REGISTRY:-ghcr.io/abitech-peru}/pilotssh-web:${IMAGE_TAG:?Falta IMAGE_TAG}
    env_file: .env
    ports:
      - target: 80
        published: ${WEB_PORT:-8092}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      # El arranque prerenderiza: espera a la API
      start_period: 90s
    deploy:
      replicas: 2
      # La nueva atiende antes de apagar la vieja; si falla, vuelve atras
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 20s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
        delay: 5s
