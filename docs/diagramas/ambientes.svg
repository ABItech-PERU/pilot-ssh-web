<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 152" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ambientes-title ambientes-desc" id="ambientes-root">
        <title id="ambientes-title">De una rama a producción</title>
        <desc id="ambientes-desc">Una rama corta entra por pull request con la CI en verde; main despliega a uat y una etiqueta vX.Y.Z lleva la misma imagen a prod.</desc>
        <defs>
      <style>#ambientes-root { font-family: 'Inter', system-ui, sans-serif; color: #121921; }
      #ambientes-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#ambientes-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="ambientes-ambientes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545c65"/></marker>
          <marker id="ambientes-ambientes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00747a"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#fcfdfe"/>
        <path d="M 224,76 H 272" fill="none" stroke="#545c65" stroke-width="1.2" marker-end="url(#ambientes-ambientes-arrow)"/>
