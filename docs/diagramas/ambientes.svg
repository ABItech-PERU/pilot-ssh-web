        <text x="64" y="57" fill="#121921" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RAMA</text>
        <text x="132" y="84" fill="#121921" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Rama corta</text>
        <text x="132" y="102" fill="#545c65" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">feature/* o fix/*</text>
        <rect x="272" y="40" width="184" height="72" rx="6" fill="#fcfdfe"/>
