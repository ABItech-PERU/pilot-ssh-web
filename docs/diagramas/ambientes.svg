        <text x="364" y="102" fill="#545c65" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">CI en verde</text>
        <rect x="504" y="40" width="184" height="72" rx="6" fill="#fcfdfe"/>
