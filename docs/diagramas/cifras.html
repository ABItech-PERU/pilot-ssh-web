<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La web de Pilot SSH en cifras</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #fcfdfe; color: #121921; padding: 3rem 1rem; }
    .frame { max-width: 1200px; width: 100%; min-width: 0; margin: 0 auto; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="diagram-container">
      <svg viewBox="0 0 960 156" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cifras-title cifras-desc">
        <title id="cifras-title">La web de Pilot SSH en cifras</title>
        <desc id="cifras-desc">13 dominios, 377 pruebas, 2 temas y 3 ambientes.</desc>
        <defs>
          <marker id="cifras-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#545c65"/></marker>
          <marker id="cifras-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00747a"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#fcfdfe"/>
        <text x="150" y="76" fill="#121921" font-size="40" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="700">13</text>
        <text x="150" y="104" fill="#121921" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Dominios</text>
        <text x="150" y="124" fill="#545c65" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">en src/features/</text>
        <line x1="260" y1="32" x2="260" y2="128" stroke="rgba(18,25,33,0.12)" stroke-width="0.8"/>
        <text x="370" y="76" fill="#00747a" font-size="40" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="700">377</text>
        <text x="370" y="104" fill="#121921" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Pruebas</text>
        <text x="370" y="124" fill="#545c65" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">con Vitest</text>
        <line x1="480" y1="32" x2="480" y2="128" stroke="rgba(18,25,33,0.12)" stroke-width="0.8"/>
        <text x="590" y="76" fill="#121921" font-size="40" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="700">2</text>
        <text x="590" y="104" fill="#121921" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Temas</text>
        <text x="590" y="124" fill="#545c65" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">claro y oscuro</text>
        <line x1="700" y1="32" x2="700" y2="128" stroke="rgba(18,25,33,0.12)" stroke-width="0.8"/>
        <text x="810" y="76" fill="#121921" font-size="40" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="700">3</text>
        <text x="810" y="104" fill="#121921" font-size="16" font-family="'Inter', system-ui, sans-serif" text-anchor="middle" font-weight="600">Ambientes</text>
        <text x="810" y="124" fill="#545c65" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">local, uat y prod</text>
      </svg>
    </div>
  </div>
</body>
</html>
