# Web compilada. El HTTPS lo pone el proxy de delante
# __API_URL__ y __API_WS_URL__ se rellenan al compilar la imagen

# Con hash en el nombre: cache de un ano. Lo demas se revalida
map $uri $cache_de_la_web {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Aqui y no por location: un add_header interno anula los de fuera
  add_header Cache-Control $cache_de_la_web always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Nonce por respuesta: lo exige el antifraude de Mercado Pago
  sub_filter '__CSP_NONCE__' $request_id;
  sub_filter_once on;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id' https://sdk.mercadopago.com https://http2.mlstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: __API_URL__ https://*.mlstatic.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mercadolivre.com; connect-src 'self' __API_URL__ __API_WS_URL__ https://*.mercadopago.com https://*.mercadolibre.com https://http2.mlstatic.com; frame-src blob: https://*.mercadopago.com https://*.mercadolibre.com; object-src blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # /pricing -> pricing.html; lo demas, al panel
  location / {
    try_files $uri $uri.html $uri/ /app.html;
  }

  # Archivo de otra version: 404, no la aplicacion
  location /assets/ {
    try_files $uri =404;
  }
}
